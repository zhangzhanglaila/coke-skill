<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="coke-skill banner">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FE2C55"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#25F4EE"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FE2C55"/>
      <stop offset="1" stop-color="#25F4EE"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FE2C55" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FE2C55" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.8" cy="0.8" r="0.9">
      <stop offset="0" stop-color="#25F4EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#25F4EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridp" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="18" fill="#0e0e13"/>
  <rect width="1000" height="260" rx="18" fill="url(#gridp)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glowL)"/>
  <rect width="1000" height="260" rx="18" fill="url(#glowR)"/>

  <text x="980" y="40" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#8b8b98" opacity="0.9">汗流浃背了吧，老弟</text>
  <text x="990" y="230" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#25F4EE" opacity="0.5">凶多吉少</text>
  <text x="60" y="242" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#8b8b98" opacity="0.7">阿玛特拉斯 · 我痞吗 · 包变脸的老弟 · 那吃美了怎么办？</text>

  <text x="56" y="98" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="62" font-weight="800" letter-spacing="4" fill="url(#title)">⚡ 雷霆语言系统</text>

  <text x="58" y="148" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="600" fill="#f2f2f5">coke-skill · 让 AI 变成「Coke老师」陪你聊天</text>
  <text x="58" y="184" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#8b8b98">40 条语录逐条考据 · 20 条已核实 · 每条都查得到出处 · 人设模式 / 考据模式双切换</text>

  <rect x="56" y="204" width="220" height="6" rx="3" fill="url(#bar)"/>
