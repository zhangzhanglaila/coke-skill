<style>

    --red:#FE2C55; --cyan:#25F4EE; --ink:#f2f2f5; --muted:#8b8b98;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); overflow-x:hidden;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  }
  /* 背景光斑 + 网格 */
  .glow{position:fixed;border-radius:50%;filter:blur(120px);opacity:.35;pointer-events:none;z-index:0}
  .glow.a{width:520px;height:520px;background:var(--red);top:-160px;left:-120px}
  .glow.b{width:460px;height:460px;background:var(--cyan);bottom:-140px;right:-100px;opacity:.22}
  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;

                     linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);
  }
  /* 弹幕 */
  .danmaku{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .dm{position:absolute;white-space:nowrap;color:rgba(255,255,255,.14);
      font-size:15px;letter-spacing:1px;animation:fly linear infinite}
  .dm b{color:rgba(37,244,238,.35);font-weight:600}
  @keyframes fly{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}

  main{position:relative;z-index:2;max-width:880px;margin:0 auto;padding:56px 20px 80px}

  /* Hero */
  .badge{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px)}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  h1{margin:18px 0 6px;font-size:clamp(40px,7vw,68px);font-weight:800;letter-spacing:2px;line-height:1.1;
    background:linear-gradient(92deg,var(--red) 20%,#fff 50%,var(--cyan) 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .zh{font-style:italic}
  .sub{color:var(--muted);font-size:15px;max-width:520px;line-height:1.7}
  .sub b{color:#d7d7e0}

  /* 语录卡 */
  .stage{margin-top:44px;position:relative}
  .card{
    position:relative;background:linear-gradient(160deg,rgba(254,44,85,.10),rgba(28,28,40,.9) 40%,rgba(37,244,238,.08));
    border:1px solid var(--line);border-radius:24px;padding:44px 40px 34px;
    backdrop-filter:blur(10px);min-height:300px;display:flex;flex-direction:column;
    transition:border-color .3s, box-shadow .3s;
  }
  .card.hit{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(3px)}
    30%,50%,70%{transform:translateX(-5px)} 40%,60%{transform:translateX(5px)}
  }
  .quote-mark{position:absolute;top:14px;left:26px;font-size:90px;line-height:1;
    font-family:Georgia,serif;color:var(--red);opacity:.35;user-select:none}
  .quote{
    margin-top:26px;font-size:clamp(26px,4.6vw,44px);font-weight:800;line-height:1.45;
    letter-spacing:1px;text-shadow:0 0 24px rgba(254,44,85,.25);
  }
  .quote.glitch{animation:glitch .35s steps(2)}
  @keyframes glitch{
    0%{text-shadow:3px 0 var(--red),-3px 0 var(--cyan)}
    50%{text-shadow:-3px 2px var(--red),3px -2px var(--cyan)}
    100%{text-shadow:0 0 24px rgba(254,44,85,.25)}
  }
  .meta{margin-top:auto;padding-top:26px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .chip{font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .chip.type{color:var(--cyan);border-color:rgba(37,244,238,.35)}
  .chip.ok{color:#5be49b;border-color:rgba(91,228,155,.35)}
  .chip.warn{color:#f5b563;border-color:rgba(245,181,99,.35)}
  .conf{font-size:12px;color:var(--muted);margin-left:auto}
  .conf b{color:#fff}

  /* 按钮 */
  .actions{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{
    border:none;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:2px;
    border-radius:14px;padding:16px 30px;font-size:17px;color:#fff;
    background:linear-gradient(135deg,var(--red),#ff5f7e);
    box-shadow:0 8px 28px rgba(254,44,85,.35),inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .12s, box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(254,44,85,.5)}

  .proof-inner{border:1px solid var(--line);border-radius:16px;padding:20px 22px;

  .tagline{font-size:12px;color:var(--muted);margin-top:8px}

  .fchip:hover{color:#fff;border-color:rgba(255,255,255,.3)}
  .fchip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}

  /* 全部语录网格 */
  .grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .mini{
    cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 16px 12px;transition:transform .15s,border-color .2s;

  .mini .f{margin-top:10px;font-size:11px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}

  .stat span{font-size:12px;color:var(--muted)}

  footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);line-height:2}

    opacity:0;transition:all .3s;z-index:9;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

const $=id=>document.getElementById(id);
const quoteEl=$("quote"),card=$("card"),proof=$("proof");
let current=null,lastId=null;

function show(q){
  current=q;
  quoteEl.textContent=q.text;
  $("qtype").textContent=q.type;
  const ok=$("qok");
  if(q.type==="称号"){ok.textContent="◆ 称号梗";ok.className="chip warn";}
  else{ok.textContent="✔ 已核实";ok.className="chip ok";}
  $("qconf").textContent=q.confidence.toFixed(2);
  $("p-scene").textContent=q.scene;
  $("p-plat").textContent=`${q.platform} · ${q.date}`;
  const a=$("p-src");a.href=q.source_url;a.textContent=q.source_url;
  $("p-tags").textContent=q.tags.map(t=>"#"+t).join("　");
  // 动画
  quoteEl.classList.remove("glitch");card.classList.remove("hit");
  void quoteEl.offsetWidth;
  quoteEl.classList.add("glitch");card.classList.add("hit");
  history.replaceState(null,"","#"+q.id);
}
function randomQuote(){
  let pool=QUOTES;
  if(pool.length>1){do{current=pool[Math.floor(Math.random()*pool.length)];}while(current.id===lastId);}
  else current=pool[0];
  lastId=current.id;
  show(current);
}

$("fire").onclick=()=>{randomQuote();proof.classList.remove("open");$("proofBtn").textContent="🔍 考据一下";};
$("proofBtn").onclick=()=>{
  proof.classList.toggle("open");
  $("proofBtn").textContent=proof.classList.contains("open")?"🔍 收起考据":"🔍 考据一下";
};
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600);}
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(current.text);toast("已复制："+current.text.slice(0,14));}catch(e){toast("复制失败，手动选中文本吧");}};
$("shareBtn").onclick=async()=>{const url=location.origin+location.pathname+"#"+current.id;try{await navigator.clipboard.writeText(url);toast("分享链接已复制");}catch(e){toast("复制失败");}};
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();randomQuote();}});

// 分类筛选 + 网格
const types=[...new Set(QUOTES.map(q=>q.type))];
const filters=$("filters");
["全部",...types].forEach((t,i)=>{
  const b=document.createElement("button");
  b.className="fchip"+(i===0?" on":"");b.textContent=t;
  b.onclick=()=>{
    document.querySelectorAll(".fchip").forEach(x=>x.classList.remove("on"));b.classList.add("on");
    document.querySelectorAll(".mini").forEach(m=>{
      m.classList.toggle("hidden",t!=="全部"&&m.dataset.type!==t);
    });
  };
  filters.appendChild(b);
});
const grid=$("grid");
QUOTES.forEach(q=>{
  const d=document.createElement("div");
  d.className="mini";d.dataset.type=q.type;
  d.innerHTML=`<div class="t">${q.text}</div>
    <div class="f"><span>${q.type}</span><span>${q.platform}</span><span>置信 ${q.confidence.toFixed(2)}</span></div>`;
  d.onclick=()=>{show(q);window.scrollTo({top:0,behavior:"smooth"});};
  grid.appendChild(d);
});

// 弹幕
const lane=$("danmaku");
const dmTexts=QUOTES.map(q=>q.text);
for(let i=0;i<7;i++){
  const s=document.createElement("span");
  s.className="dm";
  s.innerHTML=dmTexts.map(t=>`　<b>${t}</b>`).join("");
  s.style.top=(6+i*13)+"%";
  s.style.animationDuration=(38+Math.random()*30)+"s";
  s.style.animationDelay=(-Math.random()*40)+"s";
  lane.appendChild(s);
}

// 统计 & 初始化
$("total").textContent=QUOTES.length;$("s-total").textContent=QUOTES.length;
$("s-types").textContent=types.length;
$("s-viral").textContent=QUOTES.filter(q=>q.tags.includes("出圈梗")).length;
const init=location.hash.slice(1);
const hit=QUOTES.find(q=>q.id===init);
show(hit||QUOTES[0]);lastId=(hit||QUOTES[0]).id;
</script>
</body>
</html>
